[project]
name = "mekiki-open-skills"
dynamic = ["version"]
description = "Open catalog of software engineering skills used by Mekiki."
requires-python = ">=3.12"
dependencies = [
    "jsonschema==4.26.0",
    "pyyaml==6.0.3",
]

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"
raw-options = { fallback_version = "0.0.0" }

[tool.uv]
package = false

[dependency-groups]
dev = [
    "hypothesis==6.168.3",
    "mypy==2.3.1",
    "pyhamcrest==2.1.0",
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "pytest-fail-slow==0.6.0",
    "pytest-randomly==5.0.0",
    "pytest-timeout==2.4.0",
    "ruff==0.16.9",
    "types-jsonschema==4.26.0.20260518",
    "types-pyyaml==6.0.12.20260906",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:logging --strict-markers --basetemp=tmp --fail-slow=5s --cov=catalog --cov-report=term-missing --cov-fail-under=90"
timeout = 30
markers = ["online: needs Internet access"]

[tool.coverage.run]
omit = ["catalog/__main__.py"]

[tool.ruff]
line-length = 88
target-version = "py312"
include = ["catalog/**/*.py", "tests/**/*.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
files = ["catalog", "tests"]
strict = true

  kanban:
    name: Kanban
    level: junior
    aliases: [WIP limits]
    prerequisites: [methodology]

  waterfall:
    name: Waterfall
    level: junior
    prerequisites: [methodology]

  code-review:
    name: Code Review
    level: middle
    aliases: [pull requests]

name: Release

on:
  push:
    tags: ["*.*.*"]

permissions:
  contents: read

jobs:
  check:
    uses: ./.github/workflows/check.yml

  release:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: make install
      - run: make build VERSION="$GITHUB_REF_NAME"
      - run: gh release create "$GITHUB_REF_NAME" skills.json --title "$GITHUB_REF_NAME" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
